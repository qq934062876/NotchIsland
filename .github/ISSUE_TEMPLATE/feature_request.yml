name: 功能建议
description: 新能力、交互改进、适配诉求
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        本项目坚持「岛贴刘海、不抢焦点、默认不打扰」。与这三条冲突的建议大概率不会被采纳，请先说明为什么必须破例。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的具体问题
      description: 描述场景与频率，不要只写「希望支持 X」
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的改法
      description: 涉及 UI 的请附草图；涉及权限或后台行为的请说明默认值应该是什么
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑过的替代方案
      description: 例如用别的 App、快捷键、菜单栏工具

  - type: dropdown
    id: scope
    attributes:
      label: 影响面
      multiple: true
      options:
        - 需要新增系统权限
        - 涉及私有 API
        - 会改变默认行为
        - 影响多屏 / 不同刘海尺寸
        - 只是界面调整
